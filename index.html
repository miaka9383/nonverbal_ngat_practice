<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NGAT Nonverbal Test Prep</title>
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --primary: #3b82f6;
            --success: #10b981; --error: #ef4444; --text: #1e293b; --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; user-select: none; -webkit-user-select: none;
        }
        .container {
            background: var(--card); padding: 25px; border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); max-width: 600px; width: 92%; text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        h1 { margin-top: 0; font-size: 2.2rem; color: #1e293b; }
        .subtitle { color: #64748b; font-size: 1.1rem; margin-bottom: 30px; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; font-weight: 700; color: #94a3b8;
            border-bottom: 2px solid var(--border); padding-bottom: 15px;
        }
        .puzzle-box { background: #f1f5f9; padding: 15px; border-radius: 20px; margin: 15px auto; display: inline-block; }
        .matrix-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .sequence-1x4 { display: flex; gap: 10px; }
        .cell {
            background: white; width: 110px; height: 110px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 12px; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .option-btn {
            background: white; border: 3px solid #f1f5f9; border-radius: 18px; padding: 10px;
            cursor: pointer; transition: all 0.2s; min-height: 110px;
            display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent;
        }
        .option-btn.correct-pick { border-color: var(--success); background: #ecfdf5; }
        .option-btn.wrong-pick { border-color: var(--error); background: #fef2f2; }
        .primary-btn {
            background: var(--primary); color: white; border: none; padding: 18px;
            font-size: 1.2rem; font-weight: 700; border-radius: 14px; width: 100%;
            margin-top: 15px; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .hidden { display: none !important; }
        .trophy-icon { font-size: 5rem; margin: 20px 0; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

<div class="container">
    <div id="intro-screen" class="screen active">
        <h1>NGAT Nonverbal Test Prep</h1>
        <p class="subtitle">10 Levels of Dynamic Spatial Logic</p>
        <button class="primary-btn" onclick="startGame()">Start Test</button>
    </div>

    <div id="test-screen" class="screen">
        <div class="header">
            <span id="level-counter">Level 1</span>
            <span id="q-num">Q: 1/10</span>
            <button style="background:none; border:none; color:var(--error); font-weight:bold;" onclick="location.reload()">Restart</button>
        </div>
        <div id="puzzle-area" class="puzzle-box"></div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" style="margin-top:15px; font-weight:bold; height:24px;"></div>
        <button id="next-btn" class="primary-btn hidden" onclick="handleNext()">Next Puzzle</button>
    </div>

    <div id="level-screen" class="screen">
        <h1>Level Complete!</h1>
        <div class="trophy-icon">⭐</div>
        <button class="primary-btn" onclick="startNextLevel()">Continue to Level <span id="next-level-num"></span></button>
    </div>

    <div id="trophy-screen" class="screen">
        <h1>Challenge Conquered!</h1>
        <div class="trophy-icon">🏆</div>
        <p id="final-stats"></p>
        <button class="primary-btn" onclick="location.reload()">Restart Practice</button>
    </div>
</div>

<script>
    let state = { level: 1, q: 0, totalScore: 0, levelScore: 0, answered: false };
    const COLORS = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#ec4899', '#14b8a6'];
    const SHAPES = ['circle', 'square', 'triangle', 'star'];

    function startGame() { showScreen('test-screen'); loadQuestion(); }
    function startNextLevel() { state.level++; state.q = 0; state.levelScore = 0; showScreen('test-screen'); loadQuestion(); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function getSVG(layers) {
        let svg = `<svg width="85" height="85" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">`;
        layers.forEach(l => {
            const s = (l.scale || 1) * 40, r = l.rot || 0, c = l.color || '#333';
            svg += `<g transform="rotate(${r} 50 50)">`;
            if (l.shape === 'circle') svg += `<circle cx="50" cy="50" r="${s}" fill="${c}" />`;
            else if (l.shape === 'square') svg += `<rect x="${50-s}" y="${50-s}" width="${s*2}" height="${s*2}" rx="4" fill="${c}" />`;
            else if (l.shape === 'triangle') svg += `<polygon points="50,${50-s} ${50+s},${50+s} ${50-s},${50+s}" fill="${c}" />`;
            else if (l.shape === 'star') svg += `<polygon points="50,10 61,35 88,35 67,52 74,78 50,62 26,78 33,52 12,35 39,35" fill="${c}" transform="scale(${s/40}) translate(${50*(40/s-1)} ${50*(40/s-1)})" />`;
            else if (l.shape === 'dot') svg += `<circle cx="${l.cx}" cy="${l.cy}" r="12" fill="${c}" />`;
            svg += `</g>`;
        });
        return svg + `</svg>`;
    }

    // --- ENGINES (Fully Randomized) ---
    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function enginePersistence() {
        const bgS = getRandom(SHAPES), bgC = getRandom(COLORS), fgC = getRandom(COLORS.filter(c => c !== bgC));
        const pts = [[25,25], [75,25], [25,75], [75,75]]; pts.sort(() => Math.random() - 0.5);
        const cell = (i) => [{shape: bgS, color: bgC, scale: 0.85}, {shape: 'dot', color: fgC, cx: pts[i][0], cy: pts[i][1]}];
        return { layout: 'matrix-2x2', cells: [cell(0), cell(1), cell(2)], answer: cell(3) };
    }

    function engineAnalogy() {
        const s1 = getRandom(SHAPES), s2 = getRandom(SHAPES.filter(s => s !== s1));
        const c1 = getRandom(COLORS), c2 = getRandom(COLORS.filter(c => c !== c1));
        const cell = (s, c, dot) => {
            let l = [{shape: s, color: c, scale: 0.8}];
            if(dot) l.push({shape: 'dot', color: '#fff', cx: 50, cy: 50});
            return l;
        };
        return { layout: 'matrix-2x2', cells: [cell(s1, c1, false), cell(s1, c1, true), cell(s2, c2, false)], answer: cell(s2, c2, true) };
    }

    function engineRotation() {
        const s = getRandom(['triangle', 'square', 'star']), c = getRandom(COLORS), start = getRandom([0, 45, 90]);
        const cell = (r) => [{shape: s, color: c, rot: r, scale: 0.8}];
        return { layout: 'sequence-1x4', cells: [cell(start), cell(start+90), cell(start+180)], answer: cell(start+270) };
    }

    function loadQuestion() {
        state.answered = false; state.q++;
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback').innerText = '';
        document.getElementById('level-counter').innerText = `Level ${state.level}`;
        document.getElementById('q-num').innerText = `Q: ${state.q}/10`;
        
        const puzzle = getRandom([enginePersistence, engineAnalogy, engineRotation])();
        renderPuzzle(puzzle);
    }

    function renderPuzzle(p) {
        const area = document.getElementById('puzzle-area');
        area.innerHTML = `<div class="${p.layout}"></div>`;
        const grid = area.firstChild;
        p.cells.forEach(c => {
            const d = document.createElement('div'); d.className = 'cell';
            d.innerHTML = renderSVG(c); grid.appendChild(d);
        });
        const q = document.createElement('div'); q.className = 'cell'; q.innerHTML = '<b>?</b>'; grid.appendChild(q);
        renderOptions(p.answer);
    }

    function renderSVG(c) { return getSVG(c); }

    function renderOptions(correct) {
        const area = document.getElementById('options'); area.innerHTML = '';
        let choices = [JSON.stringify(correct)];
        while(choices.length < 4) {
            let d = JSON.parse(JSON.stringify(correct));
            let layer = d[getRandom([0, d.length-1])];
            if(layer.rot !== undefined) layer.rot += 45;
            else if(layer.color) layer.color = getRandom(COLORS);
            if(!choices.includes(JSON.stringify(d))) choices.push(JSON.stringify(d));
        }
        choices.sort(() => Math.random() - 0.5).forEach(cStr => {
            const btn = document.createElement('button'); btn.className = 'option-btn';
            btn.innerHTML = renderSVG(JSON.parse(cStr));
            btn.onclick = () => {
                if(state.answered) return; state.answered = true;
                if(cStr === JSON.stringify(correct)) { state.levelScore++; state.totalScore++; btn.classList.add('correct-pick'); }
                else btn.classList.add('wrong-pick');
                document.getElementById('next-btn').classList.remove('hidden');
            };
            area.appendChild(btn);
        });
    }

    function handleNext() {
        if(state.q < 10) loadQuestion();
        else if(state.level < 10) { document.getElementById('next-level-num').innerText = state.level+1; showScreen('level-screen'); }
        else { document.getElementById('final-stats').innerText = `Score: ${state.totalScore}/100`; showScreen('trophy-screen'); }
    }
</script>
</body>
</html>
