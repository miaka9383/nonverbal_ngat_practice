<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NGAT Dynamic Practice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none; 
            -webkit-user-select: none;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 700;
            color: #64748b;
        }

        /* Puzzle Display */
        .puzzle-box {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 15px;
            margin: 20px auto;
            display: inline-block;
        }
        .matrix-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .sequence-1x4 { display: flex; gap: 12px; }
        
        .cell {
            background: white;
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            box-shadow: inset 0 0 0 1px #e2e8f0;
        }
        .cell.empty { font-size: 3rem; color: #cbd5e1; font-weight: bold; }

        /* Options */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        .option-btn {
            background: white;
            border: 3px solid #f1f5f9;
            border-radius: 15px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }
        .option-btn:active { transform: scale(0.95); }
        .option-btn.correct-pick { border-color: #10b981; background: #ecfdf5; }
        .option-btn.wrong-pick { border-color: #ef4444; background: #fef2f2; }

        .primary-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 12px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="intro" class="screen active">
        <h1>NGAT Mastery</h1>
        <p>Advanced Spatial Reasoning Level 2</p>
        <button class="primary-btn" onclick="startTest()">Begin Challenge</button>
    </div>

    <div id="test" class="screen">
        <div class="header">
            <span id="q-num">Q: 1/10</span>
            <span id="score">Score: 0</span>
        </div>
        <div id="puzzle-area" class="puzzle-box"></div>
        <div id="options" class="options-grid"></div>
        <button id="next-btn" class="primary-btn hidden" onclick="nextQuestion()">Next Pattern</button>
    </div>
</div>

<script>
    let state = { q: 1, score: 0, answered: false };
    const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4'];
    const SHAPES = ['circle', 'square', 'triangle', 'star', 'hexagon'];

    function startTest() {
        showScreen('test');
        loadQuestion();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function getSVG(p) {
        const size = p.scale || 1;
        const rot = p.rot || 0;
        const color = p.color || '#333';
        const count = p.count || 1;
        
        let svg = `<svg width="90" height="90" viewBox="0 0 100 100" style="transform: rotate(${rot}deg)">`;
        
        const renderShape = (cx, cy, s) => {
            const dim = 40 * s;
            if (p.shape === 'circle') return `<circle cx="${cx}" cy="${cy}" r="${dim}" fill="${color}" />`;
            if (p.shape === 'square') return `<rect x="${cx-dim}" y="${cy-dim}" width="${dim*2}" height="${dim*2}" rx="4" fill="${color}" />`;
            if (p.shape === 'triangle') return `<polygon points="${cx},${cy-dim} ${cx+dim},${cy+dim} ${cx-dim},${cy+dim}" fill="${color}" />`;
            if (p.shape === 'star') return `<polygon points="${cx},${cy-dim} ${cx+dim*0.4},${cy-dim*0.2} ${cx+dim},${cy-dim*0.2} ${cx+dim*0.5},${cy+dim*0.3} ${cx+dim*0.7},${cy+dim} ${cx},${cy+dim*0.6} ${cx-dim*0.7},${cy+dim} ${cx-dim*0.5},${cy+dim*0.3} ${cx-dim},${cy-dim*0.2} ${cx-dim*0.4},${cy-dim*0.2}" fill="${color}" />`;
            return '';
        };

        if (count === 1) svg += renderShape(50, 50, size);
        else if (count === 2) { svg += renderShape(30, 50, size*0.7); svg += renderShape(70, 50, size*0.7); }
        else if (count === 4) { 
            svg += renderShape(30, 30, size*0.5); svg += renderShape(70, 30, size*0.5); 
            svg += renderShape(30, 70, size*0.5); svg += renderShape(70, 70, size*0.5); 
        }
        
        return svg + `</svg>`;
    }

    function loadQuestion() {
        state.answered = false;
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('q-num').innerText = `Q: ${state.q}/10`;
        
        const engine = Math.floor(Math.random() * 5);
        let puzzle = {};

        if (engine === 0) puzzle = generateMatrixRule(); // 2x2 logic
        else if (engine === 1) puzzle = generateScaleSequence(); // 1x4 logic
        else if (engine === 2) puzzle = generateRotationSequence(); // 1x4 logic
        else if (engine === 3) puzzle = generateCountSequence(); // 1x4 logic
        else puzzle = generateInversionMatrix(); // 2x2 logic

        renderPuzzle(puzzle);
    }

    // --- LOGIC ENGINES ---

    function generateMatrixRule() {
        const s1 = SHAPES[0], s2 = SHAPES[1], c1 = COLORS[0], c2 = COLORS[1];
        return {
            layout: 'matrix-2x2',
            cells: [{shape:s1, color:c1}, {shape:s2, color:c1}, {shape:s1, color:c2}],
            answer: {shape:s2, color:c2}
        };
    }

    function generateScaleSequence() {
        const s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
        const c = COLORS[Math.floor(Math.random()*COLORS.length)];
        return {
            layout: 'sequence-1x4',
            cells: [{shape:s, color:c, scale:0.4}, {shape:s, color:c, scale:0.7}, {shape:s, color:c, scale:1.0}],
            answer: {shape:s, color:c, scale:1.3}
        };
    }

    function generateRotationSequence() {
        const s = 'triangle', c = COLORS[2];
        const start = [0, 45, 90][Math.floor(Math.random()*3)];
        return {
            layout: 'sequence-1x4',
            cells: [{shape:s, color:c, rot:start}, {shape:s, color:c, rot:start+90}, {shape:s, color:c, rot:start+180}],
            answer: {shape:s, color:c, rot:start+270}
        };
    }

    function generateCountSequence() {
        const s = SHAPES[3], c = COLORS[4];
        return {
            layout: 'sequence-1x4',
            cells: [{shape:s, color:c, count:1}, {shape:s, color:c, count:2}, {shape:s, color:c, count:1}],
            answer: {shape:s, color:c, count:2}
        };
    }

    function generateInversionMatrix() {
        const c1 = COLORS[0], c2 = COLORS[1];
        return {
            layout: 'matrix-2x2',
            cells: [{shape:'circle', color:c1}, {shape:'square', color:c1}, {shape:'circle', color:c2}],
            answer: {shape:'square', color:c2}
        };
    }

    function renderPuzzle(p) {
        const area = document.getElementById('puzzle-area');
        area.innerHTML = `<div class="${p.layout}"></div>`;
        const grid = area.firstChild;
        
        p.cells.forEach(c => {
            const div = document.createElement('div');
            div.className = 'cell';
            div.innerHTML = getSVG(c);
            grid.appendChild(div);
        });
        
        const qCell = document.createElement('div');
        qCell.className = 'cell empty';
        qCell.innerText = '?';
        grid.appendChild(qCell);

        renderOptions(p.answer);
    }

    function renderOptions(correct) {
        const options = document.getElementById('options');
        options.innerHTML = '';
        let choices = [correct];
        
        while(choices.length < 4) {
            let distractor = {...correct, color: COLORS[Math.floor(Math.random()*COLORS.length)]};
            if (Math.random() > 0.5) distractor.shape = SHAPES[Math.floor(Math.random()*SHAPES.length)];
            if (!choices.some(c => JSON.stringify(c) === JSON.stringify(distractor))) choices.push(distractor);
        }
        
        choices.sort(() => Math.random() - 0.5).forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = getSVG(c);
            btn.onclick = () => {
                if(state.answered) return;
                state.answered = true;
                if(JSON.stringify(c) === JSON.stringify(correct)) {
                    btn.classList.add('correct-pick');
                    state.score++;
                } else {
                    btn.classList.add('wrong-pick');
                }
                document.getElementById('score').innerText = `Score: ${state.score}`;
                document.getElementById('next-btn').classList.remove('hidden');
            };
            options.appendChild(btn);
        });
    }

    function nextQuestion() {
        if(state.q < 10) { state.q++; loadQuestion(); }
        else alert(`Finish! Total Score: ${state.score}/10`);
    }
</script>
</body>
</html>
